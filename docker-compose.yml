services:
  db:
    image: postgres:16
    container_name: jobtracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobtracker
    ports:
      - "5433:5432"
    volumes:
      - jobtracker-pgdata:/var/lib/postgresql/data

volumes:
  jobtracker-pgdata:
